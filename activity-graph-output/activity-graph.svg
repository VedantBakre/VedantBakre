    .ct-line {
      fill: none;
      stroke-width: 3.5px;
      stroke-dasharray: 6000;
      stroke-dashoffset: 6000;
      stroke: #a855f7;
      animation: dash 3.5s ease-in-out forwards;
    }
    .ct-point {
      stroke-width: 8.5px;
      stroke-linecap: round;
      stroke: #ec4899;
      animation: blink 1s ease-in-out forwards;
      cursor: pointer;
    }
    @keyframes blink {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }
